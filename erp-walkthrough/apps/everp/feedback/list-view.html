<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EV ERP: open questions</title>
<style>
  :root { --ink:#1d2433; --muted:#5b6577; --line:#dde2ea; --bg:#f3f5f8; --card:#fff; --brand:#1a56db; --soft:#e8effc;
          --miss:#8a5300; --missbg:#fff1d6; --q:#1e40af; --qbg:#e0e9ff; --conf:#b42318; --confbg:#fde7e4; --good:#0a7d3b; --goodbg:#e3f6ea;
          font-family: system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
  @media (prefers-color-scheme: dark) { :root { --ink:#e6e9f0; --muted:#9aa6bb; --line:#2f3a4d; --bg:#10151f; --card:#182030; --soft:#1e2a44;
          --missbg:#3a2c10; --miss:#f5c26b; --qbg:#1b2a52; --q:#9db8ff; --confbg:#4a1d19; --conf:#ffa79e; --goodbg:#12301f; --good:#74dd9b; } }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); line-height:1.45; }
  header { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .wrap { max-width:960px; margin:0 auto; padding:12px 16px; }
  h1 { font-size:20px; margin:0 0 2px; } .sub { color:var(--muted); font-size:14px; margin:0; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:10px; }
  input[type=search], select, textarea { font:inherit; font-size:16px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--card); color:var(--ink); }
  input[type=search] { flex:1 1 220px; min-width:0; }
  button { font:inherit; min-height:44px; padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
  label.chk { display:flex; align-items:center; gap:6px; min-height:44px; font-size:14px; }
  .count { color:var(--muted); font-size:14px; }
  main.wrap { padding-bottom:64px; }
  .help { background:var(--soft); border-radius:10px; padding:10px 14px; margin:16px 0; font-size:14px; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:28px 0 8px; }
  .screen { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; }
  .screen > h3 { margin:0; padding:12px 16px; font-size:16px; background:var(--soft); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .screen > h3 small { color:var(--muted); font-weight:400; }
  .item { padding:14px 16px; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:0; }
  .tag { display:inline-block; font-size:12px; font-weight:700; border-radius:999px; padding:2px 10px; margin-right:8px; }
  .Missing { background:var(--missbg); color:var(--miss); } .Question { background:var(--qbg); color:var(--q); } .Conflict { background:var(--confbg); color:var(--conf); }
  .q { margin:0 0 8px; font-weight:600; }
  .sug { background:var(--goodbg); color:var(--ink); border-left:4px solid var(--good); border-radius:6px; padding:8px 12px; margin:0 0 8px; font-size:14px; }
  .sug b { color:var(--good); }
  .src { color:var(--muted); font-size:12px; margin:0 0 8px; }
  textarea { width:100%; min-height:64px; resize:vertical; }
  .state { font-size:12px; color:var(--muted); margin-top:4px; min-height:16px; } .state.saved { color:var(--good); }
  .empty, .err { padding:24px; text-align:center; color:var(--muted); } .err { color:var(--conf); }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>EV ERP: screens with missing requirements or open questions</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="bar">
    <input type="search" id="search" placeholder="Search screens, questions, suggestions" aria-label="Search">
    <select id="kind" aria-label="Type"><option value="">All types</option><option>Missing</option><option>Question</option><option>Conflict</option></select>
    <label class="chk"><input type="checkbox" id="todo"> Only without feedback</label>
    <span class="count" id="count"></span>
    <button class="primary" id="download">Download all feedback</button>
  </div>
</div></header>
<main class="wrap" id="main"><p class="empty">Loading…</p></main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DRAFT = 'everp-feedback-draft';
let data = null;
const saved = {};   // from feedback.json (the file in this folder)
let draft = {};     // typed in this browser, not yet downloaded

try { draft = JSON.parse(localStorage.getItem(DRAFT) || '{}'); } catch { draft = {}; }
const saveDraft = () => { try { localStorage.setItem(DRAFT, JSON.stringify(draft)); } catch { /* storage blocked: drafts live until reload */ } };
const current = (id) => (id in draft ? draft[id].comment : saved[id]?.comment ?? '');

async function load() {
  try {
    data = await (await fetch('data.json', { cache: 'no-store' })).json();
  } catch {
    $('main').innerHTML = '<p class="err">Could not load data.json. Open this page through a web server, for example: <code>python3 -m http.server 8765</code> from <code>erp-walkthrough/</code>, then <code>/apps/everp/feedback/</code>.</p>';
    $('sub').textContent = '';
    return;
  }
  try {
    const f = await (await fetch('feedback.json', { cache: 'no-store' })).json();
    (f.feedback || []).forEach((x) => (saved[x.id] = x));
  } catch { /* no feedback.json yet */ }
  // A draft equal to the saved text is not a change.
  for (const id of Object.keys(draft)) if (draft[id].comment === (saved[id]?.comment ?? '')) delete draft[id];
  saveDraft();
  render();
}

function matches(it, g) {
  const q = $('search').value.trim().toLowerCase();
  if ($('kind').value && it.kind !== $('kind').value) return false;
  if ($('todo').checked && current(it.id).trim()) return false;
  return !q || [g.code, g.name, it.question, it.suggestion, it.source].join(' ').toLowerCase().includes(q);
}

function render() {
  const all = data.screens.flatMap((g) => g.items);
  const done = all.filter((i) => current(i.id).trim()).length;
  $('sub').textContent = `${data.screens.length} screens or areas, ${all.length} open items. ${data.note}`;
  let html = '<div class="help">Read each suggestion, then write what you decide in the box under it (accept, change, or reject). When you are done, press <b>Download all feedback</b> and save the file in this folder as <code>feedback.json</code>, replacing the old one. Reload the page to see it shown here.</div>';
  let shown = 0, lastGroup = '';
  for (const g of data.screens) {
    const items = g.items.filter((i) => matches(i, g));
    if (!items.length) continue;
    if (g.group !== lastGroup) { html += `<h2>${esc(g.group)}</h2>`; lastGroup = g.group; }
    html += `<section class="screen"><h3>${esc(g.name)} <small>${esc(g.code)}</small></h3>`;
    for (const it of items) {
      shown++;
      html += `<div class="item" data-id="${esc(it.id)}"><p class="q"><span class="tag ${esc(it.kind)}">${esc(it.kind)}</span>${esc(it.question)}</p>
        <p class="sug"><b>Suggestion:</b> ${esc(it.suggestion)}</p><p class="src">From: ${esc(it.source)}</p>
        <textarea aria-label="Your feedback" placeholder="Your feedback…" data-id="${esc(it.id)}">${esc(current(it.id))}</textarea>
        <div class="state" data-state="${esc(it.id)}"></div></div>`;
    }
    html += '</section>';
  }
  $('main').innerHTML = html || '<p class="empty">Nothing matches.</p>';
  $('count').textContent = `${done} of ${all.length} have feedback · showing ${shown}`;
  document.querySelectorAll('textarea[data-id]').forEach((t) => state(t.dataset.id));
}

function state(id) {
  const el = document.querySelector(`[data-state="${CSS.escape(id)}"]`);
  if (!el) return;
  const text = current(id).trim();
  const inFile = saved[id] && saved[id].comment === current(id);
  el.className = 'state' + (inFile ? ' saved' : '');
  el.textContent = !text ? '' : inFile ? `Saved in feedback.json${saved[id].updatedAt ? ' (' + saved[id].updatedAt.slice(0, 10) + ')' : ''}` : 'Not downloaded yet';
}

document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t.matches('textarea[data-id]')) return;
  const id = t.dataset.id;
  if (t.value === (saved[id]?.comment ?? '')) delete draft[id]; else draft[id] = { comment: t.value, updatedAt: new Date().toISOString() };
  saveDraft(); state(id);
  const all = data.screens.flatMap((g) => g.items);
  $('count').textContent = `${all.filter((i) => current(i.id).trim()).length} of ${all.length} have feedback`;
});
['search', 'kind', 'todo'].forEach((id) => $(id).addEventListener('input', render));

$('download').onclick = () => {
  const out = [];
  for (const g of data.screens) for (const it of g.items) {
    const comment = current(it.id).trim();
    if (!comment) continue;
    const meta = draft[it.id] ?? saved[it.id];
    out.push({ id: it.id, screen: `${g.code} ${g.name}`, kind: it.kind, question: it.question, suggestion: it.suggestion, comment, updatedAt: meta?.updatedAt ?? new Date().toISOString() });
  }
  const blob = new Blob([JSON.stringify({ feedback: out }, null, 2) + '\n'], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'feedback.json' });
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
};
load();
</script>
</body>
</html>
